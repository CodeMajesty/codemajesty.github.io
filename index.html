<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CodeMajesty | Software Dev &amp; QA</title>
    <link href="/assets/css/style.css" rel="stylesheet" />
  </head>

  <body>
    <header></header>


    <main>
      <img src="/assets/img/cm-full-logo.png" alt="CodeMajesty logo" />
    </main>

    <footer>
  <div class="footer-content">
    CodeMajesty &copy; <span id="current-year"></span>
  </div>
</footer>


    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const yearEl = document.getElementById('current-year');
        if (yearEl) {
          yearEl.textContent = new Date().getFullYear();
        }
      });
    </script>
  </body>
</html>
